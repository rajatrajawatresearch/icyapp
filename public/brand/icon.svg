<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="The Zone">
  <defs>
    <linearGradient id="bg" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset=".5" stop-color="#26262a"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe14d" stop-opacity=".7"/>
      <stop offset=".45" stop-color="#ffc400" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pin" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset=".45" stop-color="#ffd43b"/>
      <stop offset="1" stop-color="#e89a00"/>
    </linearGradient>
    <radialGradient id="well" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#3a3a40"/>
      <stop offset="1" stop-color="#121214"/>
    </radialGradient>
    <!-- the diamond's facets: white and shining, lit from the top-left -->
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dce6ef"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef5fb"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#c3d2de"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3f8"/><stop offset="1" stop-color="#b3c2d1"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aa7b3"/><stop offset="1" stop-color="#687481"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3d1dd"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f8"/><stop offset="1" stop-color="#9eafbe"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8894"/><stop offset="1" stop-color="#48515a"/></linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shine" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- where the pin touches down, then the light it throws -->
  <ellipse cx="256" cy="452" rx="74" ry="13" fill="#000" opacity=".65" filter="url(#soft)"/>
  <circle cx="256" cy="262" r="240" fill="url(#halo)"/>
  <path d="M256 446C256 446 124 320 124 214A132 132 0 1 1 388 214C388 320 256 446 256 446Z" fill="#ffd21f" opacity=".8" filter="url(#shine)"/>

  <!-- the location pin, golden -->
  <path d="M256 446C256 446 124 320 124 214A132 132 0 1 1 388 214C388 320 256 446 256 446Z" fill="url(#pin)"/>
  <!-- its shaded side -->
  <path d="M256 82A132 132 0 0 1 388 214C388 320 256 446 256 446Z" fill="#a86400" opacity=".3"/>
  <!-- light along the lit edge -->
  <path d="M256 434C232 408 134 304 134 214A122 122 0 0 1 256 92" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".75"/>

  <!-- the dark well the stone sits in -->
  <circle cx="256" cy="214" r="92" fill="url(#well)"/>
  <circle cx="256" cy="214" r="92" fill="none" stroke="#7a4a00" stroke-width="5" opacity=".7"/>

  <!-- the diamond: five crown facets over three pavilion facets, glassy and
       spinning on its own vertical axis forever (squash-X fakes the 3D turn,
       flat SVG has no real depth axis) -->
  <g transform="translate(256 220)">
    <g>
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1 1;0.08 1;-1 1;-0.08 1;1 1"
        keyTimes="0;0.25;0.5;0.75;1"
        dur="3.2s"
        calcMode="linear"
        repeatCount="indefinite"
      />
      <g transform="scale(.43) translate(-256 -278)" opacity=".62">
        <g stroke-linejoin="round" stroke-width="5">
          <path d="M90 216 172 140 200 216Z" fill="url(#c1)" stroke="url(#c1)"/>
          <path d="M172 140H256L200 216Z" fill="url(#c2)" stroke="url(#c2)"/>
          <path d="M256 140 312 216H200Z" fill="url(#c3)" stroke="url(#c3)"/>
          <path d="M256 140H340L312 216Z" fill="url(#c4)" stroke="url(#c4)"/>
          <path d="M340 140 422 216H312Z" fill="url(#c5)" stroke="url(#c5)"/>
          <path d="M90 216H200L256 416Z" fill="url(#p1)" stroke="url(#p1)"/>
          <path d="M200 216H312L256 416Z" fill="url(#p2)" stroke="url(#p2)"/>
          <path d="M312 216H422L256 416Z" fill="url(#p3)" stroke="url(#p3)"/>
        </g>
        <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
          <path d="M172 140 200 216 256 140 312 216 340 140" stroke-width="5" opacity=".55"/>
          <path d="M90 216H422" stroke-width="6" opacity=".7"/>
          <path d="M94 212 172 140H256" stroke-width="11" opacity=".95"/>
        </g>
      </g>
    </g>
  </g>

  <!-- sparkles -->
  <path d="M418 82c4.500 24 11 30.500 35 35-24 4.500-30.500 11-35 35-4.500-24-11-30.500-35-35 24-4.500 30.500-11 35-35Z" fill="#fff"/>
  <path d="M92 356c2.300 12 5.700 15.400 17.700 17.700-12 2.300-15.400 5.700-17.700 17.700-2.300-12-5.700-15.400-17.700-17.700 12-2.300 15.400-5.700 17.700-17.700Z" fill="#fff" opacity=".85"/>
  <path d="M322 160c2.800 14.500 6.900 18.700 21.400 21.400-14.500 2.800-18.700 6.900-21.400 21.400-2.800-14.500-6.900-18.700-21.400-21.400 14.500-2.800 18.700-6.900 21.400-21.400Z" fill="#fff" opacity=".9"/>
</svg>
