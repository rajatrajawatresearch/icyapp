<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="The Zone">
  <defs>
    <linearGradient id="bg" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset=".5" stop-color="#26262a"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe14d" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ffc400" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
    </radialGradient>
    <!-- one gradient per facet: lit from the top-left, darkest bottom-right -->
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffee9e"/><stop offset="1" stop-color="#ffc533"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="#ffe680"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdd55"/><stop offset="1" stop-color="#f5b000"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#eea300"/>
    </linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e59a00"/><stop offset="1" stop-color="#b06c00"/>
    </linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#d48a00"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ee9f00"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c88100"/><stop offset="1" stop-color="#7f4a00"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shine" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- contact shadow, then the light the stone throws around itself -->
  <ellipse cx="256" cy="436" rx="104" ry="18" fill="#000" opacity=".6" filter="url(#soft)"/>
  <circle cx="256" cy="270" r="236" fill="url(#halo)"/>
  <!-- the stone's own light: its outline, blurred, behind it -->
  <path d="M90 216 172 140H340L422 216 256 416Z" fill="#ffd21f" opacity=".85" filter="url(#shine)"/>

  <!-- the diamond: five crown facets over three pavilion facets -->
  <g stroke-linejoin="round" stroke-width="5">
    <path d="M90 216 172 140 200 216Z" fill="url(#c1)" stroke="url(#c1)"/>
    <path d="M172 140H256L200 216Z" fill="url(#c2)" stroke="url(#c2)"/>
    <path d="M256 140 312 216H200Z" fill="url(#c3)" stroke="url(#c3)"/>
    <path d="M256 140H340L312 216Z" fill="url(#c4)" stroke="url(#c4)"/>
    <path d="M340 140 422 216H312Z" fill="url(#c5)" stroke="url(#c5)"/>
    <path d="M90 216H200L256 416Z" fill="url(#p1)" stroke="url(#p1)"/>
    <path d="M200 216H312L256 416Z" fill="url(#p2)" stroke="url(#p2)"/>
    <path d="M312 216H422L256 416Z" fill="url(#p3)" stroke="url(#p3)"/>
  </g>

  <!-- facet edges catching the light -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 140 200 216 256 140 312 216 340 140" stroke-width="3" opacity=".55"/>
    <path d="M200 216 256 416 312 216" stroke-width="3" opacity=".4"/>
    <path d="M90 216H422" stroke-width="4" opacity=".7"/>
    <path d="M94 212 172 140H256" stroke-width="7" opacity=".95"/>
    <path d="M256 140H340L418 212" stroke-width="5" opacity=".45"/>
    <path d="M96 222 252 408" stroke-width="5" opacity=".5"/>
  </g>
  <!-- a glint on the lit crown facet -->
  <path d="M186 160 222 160 206 184Z" fill="#fff" opacity=".7"/>

  <!-- sparkles -->
  <path d="M410 86c4.500 24 11 30.500 35 35-24 4.500-30.500 11-35 35-4.500-24-11-30.500-35-35 24-4.500 30.500-11 35-35Z" fill="#fff"/>
  <path d="M98 348c2.300 12 5.700 15.400 17.700 17.700-12 2.300-15.400 5.700-17.700 17.700-2.300-12-5.700-15.400-17.700-17.700 12-2.300 15.400-5.700 17.700-17.700Z" fill="#fff" opacity=".85"/>
</svg>
